version: '3.8'

services:
  app:
    build: .
    container_name: clipgrab-app
    ports:
      - "9002:9002"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: clipgrab-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
